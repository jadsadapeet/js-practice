name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ต้องใช้ประวัติทั้งหมด เพื่อเทียบกับ commit แรก
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ตรวจเฉพาะชุดที่เริ่มทำแล้ว ชุดที่ยังไม่ได้แตะจะถูกข้าม
      - run: npm run test:started
